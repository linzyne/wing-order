    <style>
      html {
        font-size: 16px;
      }
      body {
        font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        font-size: 1rem;
        background: #f6f7f9;
        color: #18181b;
        -webkit-font-smoothing: antialiased;
        letter-spacing: -0.01em;
      }
      .animate-fade-in {
        animation: fadeIn 0.6s ease-out forwards;
      }
      .animate-pop-in {
        animation: popIn 0.4s cubic-bezier(0.26, 0.53, 0.74, 1.48);
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes popIn {
        0% { opacity: 0; transform: scale(0.96); }
        100% { opacity: 1; transform: scale(1); }
      }
      .animate-slide-up {
        animation: slideUp 0.3s ease-out;
      }
      @keyframes slideUp {
        from { opacity: 0; transform: translateY(16px); }
        to { opacity: 1; transform: none; }
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 5px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(113, 113, 122, 0.3);
        border-radius: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: rgba(113, 113, 122, 0.6);
      }

      /* Glass morphism */
      .glass {
        background: #ffffff;
        border: 1px solid #e8e8ec;
      }
      .glass-light {
        background: #fafafb;
        border: 1px solid #ececef;
      }
      /* 모던: 그림자는 얇게, 띄워 보이는 창(팝업·모달)만 살짝 깊게 */
      :root .shadow-sm, :root .shadow-md, :root .shadow-lg, :root .shadow-xl {
        box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
      }
      :root .shadow-inner { box-shadow: none; }
      :root .shadow-2xl { box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04); }
      :root .absolute.shadow-2xl, :root .fixed.shadow-2xl, :root .fixed .shadow-2xl, :root .absolute.shadow-xl, :root .absolute.shadow-lg {
        box-shadow: 0 12px 32px -8px rgba(16, 24, 40, 0.14), 0 2px 6px rgba(16, 24, 40, 0.05);
      }
      /* 모서리: 알약처럼 둥근 큰 카드 → 반듯하게 */
      :root .rounded-\[1\.8rem\], :root .rounded-\[2rem\], :root .rounded-3xl { border-radius: 1rem; }
      :root .tracking-widest { letter-spacing: 0.06em; }
      /* 안이 비면 카드째 숨김 */
      .hide-if-empty:not(:has(> * > :not(:empty))) { display: none; }

      /* Gradient accent button */
      .btn-accent {
        background: #18181b;
        color: white;
        font-weight: 900;
        transition: all 0.2s;
        box-shadow: 0 1px 2px rgba(16, 24, 40, 0.08);
      }
      .btn-accent:hover {
        background: #3f3f46;
        box-shadow: 0 2px 6px rgba(16, 24, 40, 0.12);
        transform: translateY(-1px);
      }
      .btn-accent:active {
        transform: translateY(0);
        box-shadow: 0 1px 8px rgba(225, 29, 72, 0.2);
      }

      /* Subtle glow for active elements */
      .glow-rose {
        box-shadow: 0 0 20px rgba(244, 63, 94, 0.15), 0 0 60px rgba(244, 63, 94, 0.05);
      }
      .glow-emerald {
        box-shadow: 0 0 20px rgba(16, 185, 129, 0.15), 0 0 60px rgba(16, 185, 129, 0.05);
      }

      /* Refined input focus */
      input:focus, select:focus, textarea:focus {
        border-color: rgba(79, 70, 229, 0.5) !important;
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12) !important;
      }

      /* Smooth all transitions */
      *, *::before, *::after {
        transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* ===== Quest Timeline (gamified) ===== */
      .quest-grid-bg {
        background-image:
          linear-gradient(rgba(244, 63, 94, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(244, 63, 94, 0.08) 1px, transparent 1px);
        background-size: 24px 24px;
      }
      .quest-shine {
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
        animation: questShine 2.2s linear infinite;
      }
      @keyframes questShine {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(200%); }
      }
      .quest-glow {
        animation: questGlow 1.6s ease-in-out infinite alternate;
      }
      @keyframes questGlow {
        0%   { box-shadow: 0 0 14px rgba(244, 63, 94, 0.55), 0 0 28px rgba(244, 63, 94, 0.25); }
        100% { box-shadow: 0 0 24px rgba(251, 191, 36, 0.85), 0 0 44px rgba(217, 70, 239, 0.55); }
      }
      .quest-idle {
        animation: questIdle 2.8s ease-in-out infinite;
      }
      @keyframes questIdle {
        0%, 100% { transform: translateY(0); opacity: 0.85; }
        50%      { transform: translateY(-2px); opacity: 1; }
      }
      .quest-flash {
        background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(244,63,94,0.6) 40%, transparent 70%);
        animation: questFlash 0.7s ease-out forwards;
      }
      @keyframes questFlash {
        0%   { opacity: 0; transform: scale(0.6); }
        30%  { opacity: 1; transform: scale(1.8); }
        100% { opacity: 0; transform: scale(2.6); }
      }
      .quest-particle {
        animation: questParticle 0.85s cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
      }
      @keyframes questParticle {
        0% {
          opacity: 1;
          transform: translate(-50%, -50%) rotate(var(--angle)) translateX(0) scale(1.2);
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -50%) rotate(var(--angle)) translateX(var(--dist)) scale(0.2);
        }
      }
      .quest-shake {
        animation: questShake 0.45s cubic-bezier(.36,.07,.19,.97) both;
      }
      @keyframes questShake {
        10%, 90% { transform: translateX(-1px); }
        20%, 80% { transform: translateX(2px); }
        30%, 50%, 70% { transform: translateX(-3px); }
        40%, 60% { transform: translateX(3px); }
      }

      /* 밝은 화면: 흰 글자는 진하게, 색 버튼 위 흰 글자만 그대로 */
      :root .text-white, :root .hover\:text-white:hover { color: #18181b; }

      [class~="bg-green-700"].text-white, [class~="bg-green-700"] .text-white,

      [class~="bg-sky-600"].text-white, [class~="bg-sky-600"] .text-white,
      [class~="bg-sky-700"].text-white, [class~="bg-sky-700"] .text-white,
      [class~="bg-indigo-500"].text-white, [class~="bg-indigo-500"] .text-white,

      [class*="bg-gradient"].text-white,
      [class*="bg-gradient"] .text-white,
      .btn-accent.text-white,
      .btn-accent .text-white { color: #ffffff; }
